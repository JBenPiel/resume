image:
  name: hashicorp/terraform:1.16
  entrypoint:
    - '/usr/bin/env'
    - 'PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'

stages:
  - Validate
  - Build
  - Plan
  - Apply
  - Destroy

Validate:
  stage: Validate
  script:
    - cd terraform/
    - terraform init -backend=false
    - terraform validate
    - terraform fmt -check
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(master|stage)$/ || $CI_COMMIT_BRANCH =~ /^(master|stage)$/'

Build:
  stage: Build
  image: docker:29
  needs: []
  services:
    - docker:29-dind
  script:
    - apk add --no-cache aws-cli
    - aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws/e7k4f6o3
    - docker buildx create --use --name mybuilder --driver docker-container --bootstrap
    - |
      set -eu
      set -- -t "$ECR_REPO:$CI_COMMIT_SHORT_SHA" -t "$ECR_REPO:latest"
      # Preserve Docker Hub publishing for master and scheduled pipelines only.
      if [ "$CI_PIPELINE_SOURCE" = "schedule" ] || [ "${CI_COMMIT_BRANCH:-}" = "master" ]; then
        DATE=$(date +%Y.%m.%d)
        printf '%s' "$HUB_PASSWORD" | docker login --username "$HUB_USER" --password-stdin
        set -- "$@" -t "$HUB_REPO:$DATE" -t "$HUB_REPO:latest"
      fi
      docker buildx build --platform linux/amd64,linux/arm64 "$@" --push .
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH =~ /^(master|stage)$/'

